services:
  gitlab:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8228:8228"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    restart: unless-stopped
    shm_size: "256m"

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:

