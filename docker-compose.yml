# =============================================================================
# GitLab Security Addon - Docker Compose
# Tương thích Coolify & Docker Compose v2
# =============================================================================
#
# Cách chạy:
#   1. Build:  docker compose build
#   2. Chạy:   docker compose up -d
#   3. Mở:    https://localhost (admin lần đầu: root / password trong logs)
#
#   Lấy password root:
#     docker compose exec app cat /etc/gitlab/initial_root_password
# =============================================================================

services:
  app:
    # Build từ Dockerfile trong repo (thay vì dùng image chính thức)
    build:
      context: .
      dockerfile: Dockerfile
    image: gitlab-security:latest

    container_name: gitlab-security
    hostname: gitlab.local

    ports:
      # Đổi port để tránh xung đột với coolify-proxy (đang dùng 80, 443)
      - "8080:80"     # HTTP  → truy cập qua http://IP:8080
      - "8443:443"    # HTTPS → truy cập qua https://IP:8443
      - "2222:22"     # SSH   → git clone ssh://git@IP:2222

    volumes:
      # Persistent data
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

    environment:
      # GitLab URL + External DB (1 biến duy nhất cho database)
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${EXTERNAL_URL:-http://localhost:8080}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${SSH_PORT:-2222}
        postgresql['enable'] = false
        gitlab_rails['db_url'] = '${DATABASE_URL}'

    restart: unless-stopped
    shm_size: "256m"

    # Health check để Coolify biết container đã sẵn sàng
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-ctl", "status"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 300s  # GitLab khởi động khá lâu (~5 phút)

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:

