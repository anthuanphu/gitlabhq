# Deploy GitLab + Code Server + Runner lên NAS
# IP: 192.168.1.168 — Chạy: docker compose up -d --build

services:
  gitlab:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8228:80"
      - "2222:22"
    volumes:
      - /volume1/mount/gitlab/config:/etc/gitlab
      - /volume1/mount/gitlab/logs:/var/log/gitlab
      - /volume1/mount/gitlab/data:/var/opt/gitlab
      - /volume1/mount/gitlab/workspace:/workspace
    restart: unless-stopped
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://192.168.1.168:8228';
        nginx['listen_port'] = 80;
        nginx['listen_https'] = false;
        puma['worker_processes'] = 1;
        sidekiq['max_concurrency'] = 5;
        postgresql['shared_buffers'] = '128MB';
        prometheus_monitoring['enable'] = false;
        gitlab_rails['gitlab_shell_ssh_port'] = 2222;
        gitlab_rails['env'] = { 'GITLAB_WORKSPACE_TOKEN' => '${GITLAB_WORKSPACE_TOKEN}' };
      GITLAB_WORKSPACE_TOKEN: ${GITLAB_WORKSPACE_TOKEN}
      GITLAB_PRE_RECONFIGURE_SCRIPT: "mkdir -p /workspace && chmod -R 777 /workspace"
      GITLAB_ROOT_PASSWORD: "Aurix@2026"
      GITLAB_ROOT_EMAIL: "admin@aurixsystems.vn"

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    ports:
      - "8443:8443"
    environment:
      - PUID=0
      - PGID=0
      - PASSWORD=Aurix@2026
      - DEFAULT_WORKSPACE=/workspace
    volumes:
      - /volume1/mount/gitlab/workspace:/workspace
      - /volume1/mount/gitlab/code_config:/config
    restart: unless-stopped

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    volumes:
      - /volume1/mount/gitlab/docker.sock:/var/run/docker.sock
      - /volume1/mount/gitlab/runner_config:/etc/gitlab-runner
    environment:
      - REGISTRATION_TOKEN=${GITLAB_RUNNER_TOKEN}
      - CI_SERVER_URL=http://gitlab:80
      - RUNNER_EXECUTOR=docker
      - DOCKER_IMAGE=alpine:latest
    restart: unless-stopped
