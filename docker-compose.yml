services:
  init-workspace:
    image: alpine:latest
    volumes:
      - /data/gitlab/workspace:/workspace
    command: chmod -R 777 /workspace
    restart: "no"

  gitlab:
    depends_on:
      init-workspace:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8228:80"
    volumes:
      - /data/gitlab/config:/etc/gitlab
      - /data/gitlab/logs:/var/log/gitlab
      - /data/gitlab/data:/var/opt/gitlab
      - /data/gitlab/workspace:/workspace
    restart: unless-stopped
    shm_size: "256m"
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.gitlab.loadbalancer.server.port=80"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://git.aurixsystems.vn';
        nginx['listen_port'] = 80;
        nginx['listen_https'] = false;
        nginx['proxy_set_headers'] = { 'X-Forwarded-Proto' => 'https', 'X-Forwarded-Ssl' => 'on' };
        puma['worker_processes'] = 2;
        sidekiq['max_concurrency'] = 10;
        postgresql['shared_buffers'] = '256MB';
        prometheus_monitoring['enable'] = false;
        gitlab_rails['env'] = { 'GITLAB_WORKSPACE_TOKEN' => '${GITLAB_WORKSPACE_TOKEN}' };
      GITLAB_WORKSPACE_TOKEN: ${GITLAB_WORKSPACE_TOKEN}

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD=Aurix@2026
      - DEFAULT_WORKSPACE=/workspace
    volumes:
      - /data/gitlab/workspace:/workspace
      - /data/gitlab/code-config:/config
    restart: unless-stopped
    networks:
      - coolify

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /data/gitlab/runner:/etc/gitlab-runner
    environment:
      - REGISTRATION_TOKEN=${GITLAB_RUNNER_TOKEN}
      - CI_SERVER_URL=https://git.aurixsystems.vn
      - RUNNER_EXECUTOR=docker
      - DOCKER_IMAGE=alpine:latest
      - DOCKER_NETWORK_MODE=coolify
    restart: unless-stopped
    networks:
      - coolify

networks:
  coolify:
    external: true

