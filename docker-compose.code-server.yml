services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD=Aurix@2026
      - DEFAULT_WORKSPACE=/workspace
      - GITLAB_TOKEN=${GITLAB_ADMIN_TOKEN:-}
    volumes:
      - code_workspace:/workspace
      - code_config:/config
    restart: unless-stopped
    networks:
      - coolify

networks:
  coolify:
    external: true

volumes:
  code_workspace:
  code_config:
  code_workspace:
  code_config:
  code_workspace:
  code_config:
