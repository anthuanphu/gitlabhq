# Deploy GitLab + Code Server + Runner lên NAS (không cần Coolify)
# Yêu cầu: Docker + Docker Compose trên NAS
# Chạy: docker compose up -d

services:
  # ─── Fix quyền workspace ───
  init-workspace:
    image: alpine:latest
    volumes:
      - workspace:/workspace
    command: chmod -R 777 /workspace
    restart: "no"

  # ─── GitLab CE ───
  gitlab:
    depends_on:
      init-workspace:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8228:80"         # Web UI (dùng port khác tránh conflict NAS)
      - "2222:22"          # SSH (NAS thường dùng port 22)
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      - workspace:/workspace
    restart: unless-stopped
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://NAS_IP:8228';
        nginx['listen_port'] = 80;
        nginx['listen_https'] = false;
        puma['worker_processes'] = 1;
        sidekiq['max_concurrency'] = 5;
        postgresql['shared_buffers'] = '128MB';
        prometheus_monitoring['enable'] = false;
        gitlab_rails['gitlab_shell_ssh_port'] = 2222;

  # ─── Code Server ───
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD=Aurix@2026
      - DEFAULT_WORKSPACE=/workspace
    volumes:
      - workspace:/workspace
      - code_config:/config
    restart: unless-stopped

  # ─── GitLab Runner ───
  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_config:/etc/gitlab-runner
    environment:
      - REGISTRATION_TOKEN=${GITLAB_RUNNER_TOKEN}
      - CI_SERVER_URL=http://gitlab:80
      - RUNNER_EXECUTOR=docker
      - DOCKER_IMAGE=alpine:latest
    restart: unless-stopped

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  workspace:
  code_config:
  runner_config:
